name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "tools/data/**"
      - "tools/tests/**"
      - "tools/build_dictionary.py"
      - "tools/build_stroke_database.py"
      - "tools/fetch_and_build_dictionary.sh"
      - "tools/fetch_and_build_strokes.sh"
      - "tools/verify_dictionary.py"
      - "tools/verify_strokes.py"
      - "tools/audit_dictionary_quality.py"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "tools/data/**"
      - "tools/tests/**"
      - "tools/build_dictionary.py"
      - "tools/build_stroke_database.py"
      - "tools/fetch_and_build_dictionary.sh"
      - "tools/fetch_and_build_strokes.sh"
      - "tools/verify_dictionary.py"
      - "tools/verify_strokes.py"
      - "tools/audit_dictionary_quality.py"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore generated dictionary
        id: dictionary-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/databases/pangmao.db
          key: pangmao-db-v4-${{ hashFiles('tools/fetch_and_build_dictionary.sh', 'tools/build_dictionary.py', 'tools/data/**') }}

      - name: Build offline database
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        run: tools/fetch_and_build_dictionary.sh

      - name: Restore stroke-order data
        id: stroke-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/databases/strokes.db
          key: pangmao-strokes-v1-${{ hashFiles('tools/fetch_and_build_strokes.sh', 'tools/build_stroke_database.py') }}

      - name: Build stroke-order database
        if: steps.stroke-cache.outputs.cache-hit != 'true'
        run: tools/fetch_and_build_strokes.sh

      - name: Validate offline database
        run: |
          python3 tools/verify_dictionary.py
          python3 tools/verify_strokes.py
          python3 -m unittest discover -s tools/tests -p "test_*.py"
          python3 tools/audit_dictionary_quality.py --json-out build/reports/dictionary-quality.json

      - name: Build, lint and test
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Collect installable APK
        if: github.event_name == 'workflow_dispatch'
        run: cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk Pangmao-arm64-debug.apk

      - name: Upload APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pangmao-ARM64-APK
          path: Pangmao-arm64-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload test reports on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Pangmao-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 1
