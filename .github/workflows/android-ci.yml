name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate offline database
        run: |
          tools/fetch_and_build_dictionary.sh
          python3 tools/verify_dictionary.py
          python3 -m unittest discover -s tools/tests -p "test_*.py"
          python3 tools/audit_dictionary_quality.py --json-out build/reports/dictionary-quality.json

      - name: Upload dictionary quality audit
        uses: actions/upload-artifact@v4
        with:
          name: Pangmao-dictionary-quality
          path: build/reports/dictionary-quality.json
          if-no-files-found: error
          retention-days: 30

      - name: Build, lint and test
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Collect installable APK
        run: cp app/build/outputs/apk/debug/app-universal-debug.apk Pangmao-MVP-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pangmao-MVP-APK
          path: Pangmao-MVP-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pangmao-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
