name: Prune old Pangmao CI artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-old-artifacts.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: artifact-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inventory artifacts and releases without deleting anything
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          root = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}

          def get(path):
              request = urllib.request.Request(root + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def pages(path, key=None):
              for page in range(1, 1001):
                  data = get(path + '?per_page=100&page=' + str(page))
                  batch = data[key] if key else data
                  yield from batch
                  if len(batch) < 100:
                      return
              raise RuntimeError('Pagination safety limit reached; audit incomplete')

          artifacts = list(pages('/actions/artifacts', 'artifacts'))
          runs = {}
          for artifact in artifacts:
              run_id = artifact.get('workflow_run', {}).get('id')
              if run_id and run_id not in runs:
                  runs[run_id] = get('/actions/runs/' + str(run_id))
              run = runs.get(run_id, {})
              row = {key: artifact.get(key) for key in
                     ('id', 'name', 'size_in_bytes', 'created_at', 'expires_at', 'expired', 'digest')}
              row['run'] = {key: run.get(key) for key in
                            ('id', 'name', 'path', 'event', 'status', 'conclusion', 'head_branch', 'head_sha')}
              print('ARTIFACT ' + json.dumps(row, ensure_ascii=True))
          for release in pages('/releases'):
              row = {key: release.get(key) for key in
                     ('id', 'tag_name', 'name', 'draft', 'prerelease', 'published_at', 'target_commitish')}
              row['assets'] = [{key: asset.get(key) for key in
                               ('id', 'name', 'size', 'digest', 'state')}
                              for asset in release.get('assets', [])]
              print('RELEASE ' + json.dumps(row, ensure_ascii=True))
          total = sum(a.get('size_in_bytes', 0) for a in artifacts if not a.get('expired'))
          summary = {'repository': repo, 'listed_artifacts': len(artifacts),
                     'live_bytes': total, 'deleted_artifacts': 0}
          print('AUDIT_SUMMARY ' + json.dumps(summary))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Artifact inventory (no deletions)\n\n')
              output.write(f'{len(artifacts)} artifacts listed; {total / 1_000_000:.2f} MB live.\n')
              output.write('Detailed inventory is in the job log. Code, releases, caches and run history are unchanged.\n')
          PY
