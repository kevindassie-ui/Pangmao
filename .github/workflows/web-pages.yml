name: Deploy Pangmao Web to Pages

on:
  push:
    branches: [main]
    paths:
      - "webApp/**"
      - "tools/export_web_dictionary.py"
      - "tools/tests/test_export_web_dictionary.py"
      - "tools/verify_web_app.py"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/web-ci.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static webApp directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
