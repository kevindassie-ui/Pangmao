name: Package Pangmao Web

on:
  push:
    branches: [main]
    paths:
      - "webApp/**"
      - "tools/export_web_dictionary.py"
      - "tools/tests/test_export_web_dictionary.py"
      - "tools/verify_web_app.py"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/web-ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Upload validated static site
        uses: actions/upload-artifact@v4
        with:
          name: pangmao-web-static-site
          path: webApp
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
