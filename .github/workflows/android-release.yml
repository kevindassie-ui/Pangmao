name: Android APK Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PANGMAO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pangmao-release.jks"
      - name: Validate, test and build
        env:
          PANGMAO_SIGNING_STORE_FILE: ${{ runner.temp }}/pangmao-release.jks
          PANGMAO_SIGNING_PASSWORD: ${{ secrets.PANGMAO_SIGNING_PASSWORD }}
        run: |
          tools/fetch_and_build_dictionary.sh
          python3 tools/verify_dictionary.py
          python3 -m unittest discover -s tools/tests -p "test_*.py"
          python3 tools/audit_dictionary_quality.py --json-out build/reports/dictionary-quality.json
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Name and verify APKs
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "Pangmao-${GITHUB_REF_NAME}-arm64.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "Pangmao-${GITHUB_REF_NAME}-universal.apk"
          for apk in "Pangmao-${GITHUB_REF_NAME}-arm64.apk" "Pangmao-${GITHUB_REF_NAME}-universal.apk"; do
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "Pangmao-${GITHUB_REF_NAME}-arm64.apk"
          "Pangmao-${GITHUB_REF_NAME}-arm64.apk.sha256"
          "Pangmao-${GITHUB_REF_NAME}-universal.apk"
          "Pangmao-${GITHUB_REF_NAME}-universal.apk.sha256"
          --title "Pangmao ${GITHUB_REF_NAME}"
          --notes "Pangmao 0.8.0 rend le Reader directement interactif. La lecture chinoise propose désormais 0,6×, 0,8×, 1× et 1,2×, reprend au dernier passage suivi — ou au début de la phrase selon le moteur — et distingue Reprendre, Recommencer et Arrêter. Chaque phrase peut lancer la lecture et la phrase active est surlignée. Un appui long conserve la sélection Android puis permet d’ouvrir l’entrée exacte ou ses blocs logiques. Le texte complet, le pinyin avec tons, chaque traduction et les données d’un mot peuvent être copiés séparément. Un essai vocal et un panneau indiquent le moteur, la voix, la locale et le besoin éventuel de réseau. La CI valide les six sources épinglées, 132 342 entrées chinoises, les tests, le lint et les signatures Android. Sur un téléphone Android récent, installez l’APK arm64; utilisez l’APK universel uniquement en cas d’incompatibilité."
