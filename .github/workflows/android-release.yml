name: Android APK Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore generated dictionary
        id: dictionary-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/databases/pangmao.db
          key: pangmao-db-v4-${{ hashFiles('tools/fetch_and_build_dictionary.sh', 'tools/build_dictionary.py', 'tools/data/**') }}
      - name: Build offline database
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        run: tools/fetch_and_build_dictionary.sh
      - name: Restore stroke-order data
        id: stroke-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/databases/strokes.db
          key: pangmao-strokes-v1-${{ hashFiles('tools/fetch_and_build_strokes.sh', 'tools/build_stroke_database.py') }}
      - name: Build stroke-order database
        if: steps.stroke-cache.outputs.cache-hit != 'true'
        run: tools/fetch_and_build_strokes.sh
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PANGMAO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pangmao-release.jks"
      - name: Validate, test and build
        env:
          PANGMAO_SIGNING_STORE_FILE: ${{ runner.temp }}/pangmao-release.jks
          PANGMAO_SIGNING_PASSWORD: ${{ secrets.PANGMAO_SIGNING_PASSWORD }}
        run: |
          python3 tools/verify_dictionary.py
          python3 tools/verify_strokes.py
          python3 -m unittest discover -s tools/tests -p "test_*.py"
          python3 tools/audit_dictionary_quality.py --json-out build/reports/dictionary-quality.json
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Name and verify APKs
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "Pangmao-${GITHUB_REF_NAME}-arm64.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "Pangmao-${GITHUB_REF_NAME}-arm64.apk"
          sha256sum "Pangmao-${GITHUB_REF_NAME}-arm64.apk" > "Pangmao-${GITHUB_REF_NAME}-arm64.apk.sha256"
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "Pangmao-${GITHUB_REF_NAME}-arm64.apk"
          "Pangmao-${GITHUB_REF_NAME}-arm64.apk.sha256"
          --title "Pangmao ${GITHUB_REF_NAME}"
          --notes "Pangmao 0.10.0 rend le Reader directement interactif. Le mode Lecture permet de toucher une phrase pour la sélectionner comme départ vocal, de suivre son surlignage et d’ouvrir la mini-fiche d’un mot par appui long. Le mode Modifier conserve l’édition Android native puis relance l’analyse une seule fois à la fin. Seul le texte chinois reste épinglé; les commandes secondaires défilent et la couverture lexicale suit la traduction. Dans le dictionnaire, l’ajout aux cartes est explicite et reste indépendant du statut À apprendre ou Connu. La CI valide les sources épinglées, 132 342 entrées chinoises, les tests, le lint et la signature Android. Cette phase privée publie uniquement l’APK ARM64 destiné aux téléphones Android récents."
