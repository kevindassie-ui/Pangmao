name: Android APK Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PANGMAO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pangmao-release.jks"
      - name: Validate, test and build
        env:
          PANGMAO_SIGNING_STORE_FILE: ${{ runner.temp }}/pangmao-release.jks
          PANGMAO_SIGNING_PASSWORD: ${{ secrets.PANGMAO_SIGNING_PASSWORD }}
        run: |
          tools/fetch_and_build_dictionary.sh
          python3 tools/verify_dictionary.py
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Name APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Pangmao-${GITHUB_REF_NAME}.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "Pangmao-${GITHUB_REF_NAME}.apk"
          sha256sum "Pangmao-${GITHUB_REF_NAME}.apk" > "Pangmao-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "Pangmao-${GITHUB_REF_NAME}.apk"
          "Pangmao-${GITHUB_REF_NAME}.apk.sha256"
          --title "Pangmao ${GITHUB_REF_NAME}"
          --notes "Premier APK personnel de Pangmao. Téléchargez le fichier APK ci-dessous puis autorisez l’installation depuis votre navigateur Android."
          --prerelease
