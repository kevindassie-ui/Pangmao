name: Android APK Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PANGMAO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pangmao-release.jks"
      - name: Validate, test and build
        env:
          PANGMAO_SIGNING_STORE_FILE: ${{ runner.temp }}/pangmao-release.jks
          PANGMAO_SIGNING_PASSWORD: ${{ secrets.PANGMAO_SIGNING_PASSWORD }}
        run: |
          tools/fetch_and_build_dictionary.sh
          python3 tools/verify_dictionary.py
          python3 -m unittest discover -s tools/tests -p "test_*.py"
          python3 tools/audit_dictionary_quality.py --json-out build/reports/dictionary-quality.json
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Name and verify APKs
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "Pangmao-${GITHUB_REF_NAME}-arm64.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "Pangmao-${GITHUB_REF_NAME}-universal.apk"
          for apk in "Pangmao-${GITHUB_REF_NAME}-arm64.apk" "Pangmao-${GITHUB_REF_NAME}-universal.apk"; do
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "Pangmao-${GITHUB_REF_NAME}-arm64.apk"
          "Pangmao-${GITHUB_REF_NAME}-arm64.apk.sha256"
          "Pangmao-${GITHUB_REF_NAME}-universal.apk"
          "Pangmao-${GITHUB_REF_NAME}-universal.apk.sha256"
          --title "Pangmao ${GITHUB_REF_NAME}"
          --notes "Pangmao 0.9.0 relie la consultation à la progression locale. Chaque mot chinois peut être marqué Non marqué, À apprendre ou Connu, indépendamment des favoris et des cartes SRS. Le Reader calcule une couverture lexicale transparente, refuse d’annoncer une difficulté quand le profil est incomplet, peut surligner les mots à revoir et propose une navigation compacte par phrase. Les listes À apprendre, Connus et Favoris sont accessibles depuis l’écran Cartes. Toutes les données restent hors ligne. La CI valide les six sources épinglées, 132 342 entrées chinoises, les migrations, les tests, le lint et les signatures Android. Sur un téléphone Android récent, installez l’APK arm64; utilisez l’APK universel uniquement en cas d’incompatibilité."
