name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "webApp/**"
      - "tools/build_web_variant.py"
      - "tools/export_web_chinese_fallback.py"
      - "tools/export_web_dictionary.py"
      - "tools/audit_web_dictionary_quality.py"
      - "tools/filter_zhwiktionary_french.py"
      - "tools/web_data/zhwiktionary_french_glosses.json"
      - "tools/web_data/french_reviewed_supplements.json"
      - "tools/web_data/french_translation_witnesses.json"
      - "tools/tests/**"
      - "tools/verify_web_app.py"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/web-pages.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run web unit and corpus tests
        run: npm --prefix webApp test

      - name: Run web pack exporter tests
        run: python3 -m unittest discover -s tools/tests -p "test_web*.py"

      - name: Run web dictionary exporter tests
        run: python3 -m unittest tools.tests.test_export_web_dictionary

      - name: Verify deployable web application
        run: python3 tools/verify_web_app.py

      - name: Audit every French-Chinese pair and reviewed witness
        run: python3 tools/audit_web_dictionary_quality.py --strict --json-out build/reports/web-dictionary-quality.json

      - name: Build and verify the private deer pilot
        run: |
          python3 tools/build_web_variant.py --brand wife --output build/web-wife
          python3 tools/verify_web_app.py build/web-wife
